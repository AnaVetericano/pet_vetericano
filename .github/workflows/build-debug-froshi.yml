name: Build APK Debug (Froshi)

on:
  push:
    branches:
      - Froshi
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Compilar APK Debug y ejecutar tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Aceptar licencias de Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Configurar Gradle y caché
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.VETERICANO_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleDebug -PVETERICANO_GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" --stacktrace

      - name: Publicar APK Debug como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pet-vetericano-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Ejecutar tests unitarios (Debug)
        run: ./gradlew testDebugUnitTest --stacktrace
